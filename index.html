<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Trade Signals</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div id="app">
        <header>
            <h1>TRADE</h1>
            <p id="status-text">Выберите актив для начала анализа</p>
            <div class="accuracy-badge">
                <span class="badge-dot"></span>
                <span>ТОЧНОСТЬ: 95%+</span>
            </div>
            <select id="asset-select">
                <option value="" disabled selected>ВЫБРАТЬ АКТИВ</option>
                <option value="Bitcoin">Bitcoin (BTC)</option>
                <option value="Ethereum">Ethereum (ETH)</option>
                <option value="Litecoin">Litecoin (LTC)</option>
                <option value="Solana">Solana (SOL)</option>
                <option value="Ripple">Ripple (XRP)</option>
                <option value="Cardano">Cardano (ADA)</option>
            </select>
        </header>

        <main>
            <div id="waiting-screen" class="hidden">
                <div class="waiting-container">
                    <span class="loader"></span>
                    <p class="waiting-text">АНАЛИЗ РЫНКА...</p>
                    <div id="analysis-steps" class="analysis-steps">
                        <!-- Steps will be injected here -->
                    </div>
                </div>
            </div>

            <div id="signal-container" class="signal-card hidden">
                <div id="signal-direction"></div>
                <div id="signal-details"></div>
            </div>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
